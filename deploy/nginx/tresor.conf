# Trésor — exemple nginx (frontend + proxy API)
# Dans l’app nginx TrueNAS, monter le stockage :
#   Mount Path  : /data/tresor
#   Host Path   : /mnt/tank/Tresor
# Le frontend est alors servi depuis /data/tresor/web (soit …/Tresor/web sur le serveur).
# Adaptez server_name à votre domaine.

server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.example;

    root /data/tresor/web;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:1010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:1010/health;
    }
}
